method: dense_ft
encoder:
  model_name: models/intfloat-e5-base-v2
  query_prefix: "query: "
  passage_prefix: "passage: "
  batch_size: 64
pairs:
  random_seed: ${seed}
  easy_random_per_positive: ${profile.trainable.dense_ft.easy_random_per_positive}
  hard_bm25_per_positive: ${profile.trainable.dense_ft.hard_bm25_per_positive}
  hard_dense_per_positive: ${profile.trainable.dense_ft.hard_dense_per_positive}
  hard_graph_neighbor_per_positive: ${profile.trainable.dense_ft.hard_graph_neighbor_per_positive}
  hard_pool_size: 30
train:
  data:
    hard_negatives_per_positive: 1
  trainer:
    learning_rate: 0.00002
    train_batch_size: ${profile.trainable.dense_ft.train_batch_size}
    eval_batch_size: ${profile.trainable.dense_ft.eval_batch_size}
    epochs: ${profile.trainable.dense_ft.epochs}
    warmup_steps: 0
    max_grad_norm: 1.0
    random_seed: ${seed}
    device: ${device}
    use_amp: false
  selection:
    best_metric: eval_dev_cos_sim_map@100
    higher_is_better: true
