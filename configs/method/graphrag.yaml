method: graphrag
encoder:
  model_name: models/intfloat-e5-base-v2
  query_prefix: "query: "
  passage_prefix: "passage: "
  batch_size: 64
seed_top_s: 5
max_entity_document_frequency_ratio: 0.25
sentence_resolver: frozen_dense
min_sentence_score_margin: 0.02
min_bridge_confidence: 0.2
max_partners_per_anchor: 1
max_entity_groups_per_anchor: 8
preserve_dense_top_n: 2
