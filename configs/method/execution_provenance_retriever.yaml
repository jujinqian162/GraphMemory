# Non-trained EPGM retriever. One implementation, three variants:
#   dependency_path  - reported default: directed dependency-edge traversal with
#                      schema gating and stable insertion
#   ppr_steiner      - query-conditioned typed diffusion and budgeted
#                      connected-subgraph extraction
#   typed_beam       - typed-path diagnostic
method: execution_provenance_retriever
encoder:
  model_name: models/intfloat-e5-base-v2
  query_prefix: "query: "
  passage_prefix: "passage: "
  batch_size: 64
variant: dependency_path
