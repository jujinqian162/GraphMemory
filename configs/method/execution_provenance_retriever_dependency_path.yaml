# Ablation of the non-trained EPGM retriever: the same implementation
# restricted to directed dependency-edge traversal with hard schema gating
# and stable insertion (dense score multiset preserved).
method: execution_provenance_retriever
encoder:
  model_name: models/intfloat-e5-base-v2
  query_prefix: "query: "
  passage_prefix: "passage: "
  batch_size: 64
variant: dependency_path
