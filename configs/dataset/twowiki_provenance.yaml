name: twowiki_provenance
strict_invalid_examples: false
splits:
  train:
    kind: raw
    source: data/2wiki/raw/train.json
    offset: 0
  dev:
    kind: raw
    source: data/2wiki/raw/dev.json
    offset: 0
  test:
    kind: raw
    source: data/2wiki/raw/dev.json
    offset: 0
transform:
  edge_scorer: hybrid
  seed: 13
  candidate_cap: 32
  dev_fraction: 0.5
  strict: false
  successors_per_output: 2
  hybrid_dense_weight: 0.5
  scorer_identity: provenance_semantic_v3
  query_template_version: question_source_v1
  semantic_temperature: 0.1
  weight_floor: 0.5
  branch_policy_version: rank_banded_v1
  near_rank_bucket: {lower: 2, upper: 4}
  mid_rank_bucket: {lower: 5, upper: 8}
  tail_rank_bucket: {lower: 9, upper: null}
  dense_model: models/intfloat-e5-base-v2
  dense_query_prefix: "query: "
  dense_passage_prefix: "passage: "
  dense_batch_size: 64
  # Performance-only, excluded from the version tag: changing these never
  # re-transforms and never invalidates the Prefect cache. workers>1 fans the
  # per-record conversion across processes; for a dense/hybrid scorer each
  # worker rebuilds its own encoder on the device assigned round-robin from
  # `devices`. null/1 workers keeps the serial path and binds the single ranker
  # to devices[0] (or CPU when devices is empty). On an 8-GPU host set e.g.
  # workers: 8 and devices: [cuda:0, cuda:1, ..., cuda:7].
  workers: 8
  devices: [cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
