name: traject_bench
prepare_script: scripts/prepare_traject_bench.py
source_kind: directory
# Operational workflow mapping for the pinned public benchmark revision:
# train=parallel/simple, dev=parallel/hard, test=sequential.
# TRAJECT-Bench does not publish an official training split.
splits:
  train:
    kind: raw
    source: data/traject_bench/raw
    offset: 0
    capacity: 1993
  dev:
    kind: raw
    source: data/traject_bench/raw
    offset: 0
    capacity: 1993
  test:
    kind: raw
    source: data/traject_bench/raw
    offset: 0
    capacity: 1820
