name: isetrace
trajectory_source: data/isetrace/raw/trajectories
natural_query_source: data/isetrace/query-authoring/isetrace-v7-raw.jsonl
queries:
  split_ratio:
    train: 8
    dev: 2
    test: 5
  mix_ratio:
    train:
      natural: 1
      template: 3
    dev:
      natural: 1
      template: 1
chunking:
  tokenizer_name: models/intfloat-e5-base-v2
  # 512 total encoder tokens, reserving room for E5 prefix/special tokens.
  max_tokens: 512
  reserved_tokens: 8
  overlap_tokens: 64
