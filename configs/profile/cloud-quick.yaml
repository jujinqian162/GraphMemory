name: cloud-quick
splits:
  train: {kind: fixed, count: 1000}
  dev: {kind: fixed, count: 500}
  test: {kind: fixed, count: 1000}
trainable:
  rgcn:
    hidden_dim: 128
    num_layers: 2
    batch_size: 64
    epochs: 15
    easy_random_per_positive: 2
    hard_bm25_per_positive: 2
    hard_dense_per_positive: 0
    hard_graph_neighbor_per_positive: 1
  dense_ft:
    train_batch_size: 16
    eval_batch_size: 64
    epochs: 1
    easy_random_per_positive: 2
    hard_bm25_per_positive: 2
    hard_dense_per_positive: 0
    hard_graph_neighbor_per_positive: 1
