name: quick
splits:
  train: {kind: fixed, count: 100}
  dev: {kind: fixed, count: 100}
  test: {kind: fixed, count: 100}
trainable:
  evidence_rgcn:
    hidden_dim: 128
    num_layers: 2
    per_device_graph_batch_size: 8
    epochs: 15
    easy_random_per_positive: 2
    hard_bm25_per_positive: 2
    hard_dense_per_positive: 0
    hard_graph_neighbor_per_positive: 1
  dense_ft:
    train_batch_size: 16
    eval_batch_size: 64
    epochs: 1
    easy_random_per_positive: 2
    hard_bm25_per_positive: 2
    hard_dense_per_positive: 0
    hard_graph_neighbor_per_positive: 1
